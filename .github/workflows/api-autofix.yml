name: API Ruff Autofix

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/api-autofix.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Install API tooling
        run: python -m pip install -e '.[dev]'
        working-directory: apps/api
      - name: Apply Ruff safe fixes
        run: |
          ruff check . --fix
          ruff format .
          ruff check .
        working-directory: apps/api
      - name: Commit formatting fixes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- apps/api; then
            echo "No Ruff changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api
          git commit -m "style(api): apply Ruff fixes"
          git push origin HEAD:main
