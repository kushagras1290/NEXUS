      - name: Generate complete EUKB dataset
        run: |
          set -euo pipefail
          rm -rf data/full
          python tools/generate_eukb.py --output data/full --documents 50000 --eval-queries 5000
          test "$(python - <<'PY2'
import json
print(json.load(open('data/full/manifest.json'))['chunks'])
PY2
)" = "402861"
      - name: Commit source and dataset
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "nexus-bootstrap[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: build NEXUS platform and materialize EUKB v1"
          git push origin HEAD:main