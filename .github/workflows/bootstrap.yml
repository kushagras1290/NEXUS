name: Bootstrap NEXUS

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/bootstrap.yml"

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify and materialize source tree
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .bootstrap/source.b64 > /tmp/nexus-source.tar.gz
          echo "f75892732e7227f7c25eec4be1efa70b0c98bbeee765fd6d8216afce32b463d2  /tmp/nexus-source.tar.gz" | sha256sum --check --strict
          tar -xzf /tmp/nexus-source.tar.gz -C .
          rm -rf .bootstrap BOOTSTRAP.md .github/workflows/bootstrap.yml

      - name: Generate full EUKB corpus
        shell: bash
        run: |
          set -euo pipefail
          python tools/generate_eukb.py --output data/full --documents 50000 --eval-queries 5000
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("data/full/manifest.json").read_text())
          assert manifest["documents"] == 50000, manifest
          assert manifest["chunks"] == 402861, manifest
          assert manifest["evaluation_queries"] == 5000, manifest
          print(json.dumps(manifest, indent=2))
          PY

      - name: Commit materialized application and dataset
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: build NEXUS platform and EUKB corpus"
          git push origin HEAD:main
