name: nexus

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: nexus
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexus"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [nexus]

  redis:
    image: redis:8.2-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [nexus]

  opensearch:
    image: opensearchproject/opensearch:3.8.0
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      bootstrap.memory_lock: "true"
      OPENSEARCH_JAVA_OPTS: -Xms1g -Xmx1g
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks: [nexus]

  qdrant:
    image: qdrant/qdrant:v1.19.0
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"
    networks: [nexus]

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: nexus
      MINIO_ROOT_PASSWORD: change-me-now
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks: [nexus]

  api:
    build:
      context: ./apps/api
    env_file: .env
    environment:
      NEXUS_OPENSEARCH_URL: http://opensearch:9200
      NEXUS_QDRANT_URL: http://qdrant:6333
      NEXUS_POSTGRES_DSN: postgresql+asyncpg://nexus:nexus@postgres:5432/nexus
      NEXUS_REDIS_URL: redis://redis:6379/0
      NEXUS_MINIO_ENDPOINT: minio:9000
      NEXUS_DATASET_PATH: /data/full
    volumes:
      - ./data/full:/data/full:ro
    ports:
      - "8000:8000"
    depends_on:
      opensearch: {condition: service_healthy}
      qdrant: {condition: service_started}
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    networks: [nexus]

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_NEXUS_API_URL: http://localhost:8000/api/v1
        NEXT_PUBLIC_NEXUS_DEV_AUTH: "true"
    environment:
      NEXT_PUBLIC_NEXUS_API_URL: http://localhost:8000/api/v1
      NEXT_PUBLIC_NEXUS_DEV_AUTH: "true"
    ports:
      - "3000:3000"
    depends_on:
      - api
    networks: [nexus]

volumes:
  postgres_data:
  redis_data:
  opensearch_data:
  qdrant_data:
  minio_data:

networks:
  nexus:
    driver: bridge
